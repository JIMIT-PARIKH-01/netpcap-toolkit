[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netpcap-toolkit"
version = "1.0.0"
description = "Network tools: offline PCAP analyzer + LAN scanner"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/netpcap-toolkit"

[project.scripts]
netpcap = "netpcap.cli:main"

[tool.setuptools]
packages = ["netpcap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
